<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121a2b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>マルバツクイズ｜職場のハラスメント</title>
<style>
  :root {
    --paper:      #e9ecf2;
    --paper-edge: #dde2ec;
    --card:       #ffffff;
    --ink:        #121a2b;
    --ink-soft:   #4a566e;
    --ink-faint:  #7c8699;
    --line:       #c9d0dd;
    --maru:       #cf4437;
    --batsu:      #2b4b96;
    --gold:       #a9822f;
    --shadow:     0 1px 2px rgba(18,26,43,.07), 0 18px 40px -18px rgba(18,26,43,.30);
    --serif: "Hiragino Mincho ProN","HiraMinProN-W3","Yu Mincho","YuMincho","MS PMincho",serif;
    --sans:  "Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper:      #0b1120;
      --paper-edge: #070c17;
      --card:       #151d30;
      --ink:        #e9edf6;
      --ink-soft:   #a3aec5;
      --ink-faint:  #6f7c96;
      --line:       #2a3550;
      --maru:       #f2705f;
      --batsu:      #7f9dea;
      --gold:       #d5b263;
      --shadow:     0 1px 2px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.75);
    }
  }
  :root[data-theme="dark"] {
    --paper:      #0b1120;
    --paper-edge: #070c17;
    --card:       #151d30;
    --ink:        #e9edf6;
    --ink-soft:   #a3aec5;
    --ink-faint:  #6f7c96;
    --line:       #2a3550;
    --maru:       #f2705f;
    --batsu:      #7f9dea;
    --gold:       #d5b263;
    --shadow:     0 1px 2px rgba(0,0,0,.45), 0 22px 48px -20px rgba(0,0,0,.75);
  }
  :root[data-theme="light"] {
    --paper:      #e9ecf2;
    --paper-edge: #dde2ec;
    --card:       #ffffff;
    --ink:        #121a2b;
    --ink-soft:   #4a566e;
    --ink-faint:  #7c8699;
    --line:       #c9d0dd;
    --maru:       #cf4437;
    --batsu:      #2b4b96;
    --gold:       #a9822f;
    --shadow:     0 1px 2px rgba(18,26,43,.07), 0 18px 40px -18px rgba(18,26,43,.30);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    padding: clamp(1rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem);
    display: flex;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 0%, var(--paper) 0%, var(--paper-edge) 100%);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    width: 100%;
    max-width: 44rem;
    display: flex;
    flex-direction: column;
    gap: clamp(1rem, 3vw, 1.75rem);
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: .7rem;
    border-bottom: 1px solid var(--line);
  }
  .masthead__title {
    margin: 0;
    font-family: var(--serif);
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: .14em;
  }
  .masthead__count {
    margin: 0;
    font-size: .8125rem;
    letter-spacing: .16em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* ---------- card ---------- */
  .card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 3px solid var(--ink);
    border-radius: 3px;
    box-shadow: var(--shadow);
    padding: clamp(1.6rem, 5vw, 3rem);
    overflow: hidden;
  }
  .card[hidden] { display: none; }

  .enter { animation: rise .42s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- question ---------- */
  .qhead {
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: clamp(1rem, 3vw, 1.5rem);
  }
  .qhead__no {
    font-family: var(--serif);
    font-size: .9375rem;
    letter-spacing: .22em;
    color: var(--gold);
    white-space: nowrap;
  }
  .qhead__rule {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  .qtext {
    margin: 0;
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(1.4rem, 5vw, 2.15rem);
    line-height: 1.6;
    letter-spacing: .02em;
    text-wrap: balance;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: clamp(.85rem, 3vw, 1.5rem);
    margin-top: clamp(1.75rem, 5vw, 2.75rem);
  }

  .choice {
    appearance: none;
    -webkit-appearance: none;
    display: grid;
    place-items: center;
    aspect-ratio: 1 / .82;
    padding: 0;
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 3px;
    color: inherit;
    cursor: pointer;
    transition: border-color .18s ease, background-color .18s ease, transform .18s ease;
  }
  .choice svg { width: 46%; height: auto; }
  .choice:hover, .choice:focus-visible { transform: translateY(-3px); }
  .choice:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .choice:active { transform: translateY(0); }

  .choice--maru:hover, .choice--maru:focus-visible {
    border-color: var(--maru);
    background: color-mix(in srgb, var(--maru) 8%, transparent);
  }
  .choice--batsu:hover, .choice--batsu:focus-visible {
    border-color: var(--batsu);
    background: color-mix(in srgb, var(--batsu) 8%, transparent);
  }
  .choice--maru  svg { stroke: var(--maru); }
  .choice--batsu svg { stroke: var(--batsu); }

  .hint {
    margin: 1.25rem 0 0;
    font-size: .8125rem;
    color: var(--ink-faint);
    text-align: center;
  }
  .hint kbd {
    font-family: var(--sans);
    font-size: .9em;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: .05em .4em;
  }

  /* ---------- answer ---------- */
  .mark-wrap {
    display: grid;
    place-items: center;
    padding: clamp(.75rem, 2vw, 1.25rem) 0 clamp(1rem, 3vw, 1.5rem);
  }
  .mark { width: clamp(120px, 34vw, 180px); height: auto; }
  .mark[hidden] { display: none; }
  .mark path, .mark line, .mark circle {
    fill: none;
    stroke-width: 11;
    stroke-linecap: round;
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: draw .55s cubic-bezier(.35,.75,.4,1) forwards;
  }
  .mark .s2 { animation-delay: .3s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  .mark--maru  * { stroke: var(--maru); }
  .mark--batsu * { stroke: var(--batsu); }

  .answer-label {
    margin: 0 0 clamp(1.25rem, 3vw, 1.75rem);
    text-align: center;
    font-family: var(--serif);
    font-size: clamp(1.25rem, 3.6vw, 1.6rem);
    font-weight: 600;
    letter-spacing: .08em;
  }
  .answer-label--correct { color: var(--maru); }
  .answer-label--wrong   { color: var(--batsu); }

  .commentary {
    border-top: 1px solid var(--line);
    padding-top: clamp(1.25rem, 3vw, 1.6rem);
  }
  .commentary__label {
    margin: 0 0 .5rem;
    font-size: .75rem;
    letter-spacing: .24em;
    color: var(--ink-faint);
  }
  .commentary__body {
    margin: 0;
    font-size: 1.0625rem;
    color: var(--ink-soft);
  }
  .commentary__body strong { color: var(--ink); font-weight: 600; }

  .card__foot {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 1rem;
    margin-top: clamp(1.5rem, 4vw, 2.25rem);
  }

  /* ---------- result ---------- */
  .result__lead {
    margin: 0;
    text-align: center;
    font-size: .75rem;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--ink-faint);
  }
  .score {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: .1em;
    font-family: var(--serif);
    color: var(--maru);
    padding: clamp(.5rem, 2vw, 1rem) 0 .25rem;
  }
  .score__num {
    font-size: clamp(4.5rem, 21vw, 7.5rem);
    font-weight: 600;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .score__unit { font-size: clamp(1.25rem, 4vw, 1.75rem); font-weight: 600; }

  .score__max {
    margin: 0;
    text-align: center;
    font-size: .875rem;
    letter-spacing: .12em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }
  .result__count {
    margin: clamp(1.25rem, 3vw, 1.75rem) 0 0;
    text-align: center;
    font-family: var(--serif);
    font-size: clamp(1.1rem, 3.2vw, 1.375rem);
    font-weight: 600;
    letter-spacing: .06em;
  }
  .result__comment {
    margin: .75rem auto 0;
    max-width: 30rem;
    text-align: center;
    color: var(--ink-soft);
  }
  .result__note {
    margin: clamp(1.5rem, 4vw, 2rem) auto 0;
    max-width: 30rem;
    padding-top: clamp(1rem, 3vw, 1.25rem);
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: .875rem;
    color: var(--ink-faint);
  }

  .next {
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    font-size: .9375rem;
    letter-spacing: .1em;
    padding: .7rem 1.5rem;
    background: var(--ink);
    color: var(--card);
    border: 1px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
    transition: opacity .18s ease, transform .18s ease;
  }
  .next:hover { transform: translateY(-2px); }
  .next:focus-visible { outline: 2px solid var(--maru); outline-offset: 3px; }
  .next[disabled] { opacity: .35; cursor: not-allowed; transform: none; }

  .next--ghost {
    background: transparent;
    color: var(--ink-soft);
    border-color: var(--line);
  }
  .next--ghost:hover { color: var(--ink); border-color: var(--ink); }

  /* ---------- 満点のクラッカー ---------- */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
  }
  #confetti[hidden] { display: none; }

  @media (max-width: 380px) {
    .choices { grid-template-columns: 1fr; }
    .choice { aspect-ratio: 1 / .5; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
    }
    .mark path, .mark line, .mark circle { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <h1 class="masthead__title">職場のハラスメント マルバツクイズ</h1>
    <p class="masthead__count"><span id="count-now">1</span> / <span id="count-all">1</span></p>
  </header>

  <!-- 出題 -->
  <section class="card enter" id="card-question">
    <div class="qhead">
      <span class="qhead__no" id="q-no">第 一 問</span>
      <span class="qhead__rule"></span>
    </div>
    <p class="qtext" id="q-text"></p>

    <div class="choices">
      <button class="choice choice--maru" id="btn-maru" aria-label="マル（正しい）">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="48" fill="none" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="choice choice--batsu" id="btn-batsu" aria-label="バツ（誤り）">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <line x1="20" y1="20" x2="100" y2="100" stroke-width="9" stroke-linecap="round"/>
          <line x1="100" y1="20" x2="20" y2="100" stroke-width="9" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <p class="hint"><kbd>←</kbd> でマル、<kbd>→</kbd> でバツも選べます</p>
  </section>

  <!-- 解答 -->
  <section class="card" id="card-answer" hidden>
    <div class="mark-wrap">
      <svg class="mark mark--maru" id="mark-maru" viewBox="0 0 200 200" role="img" aria-label="マル">
        <circle cx="100" cy="100" r="76" pathLength="100" transform="rotate(-105 100 100)"/>
      </svg>
      <svg class="mark mark--batsu" id="mark-batsu" viewBox="0 0 200 200" role="img" aria-label="バツ" hidden>
        <line class="s1" x1="32" y1="30" x2="168" y2="170" pathLength="100"/>
        <line class="s2" x1="168" y1="32" x2="30" y2="168" pathLength="100"/>
      </svg>
    </div>

    <p class="answer-label" id="answer-label"></p>

    <div class="commentary">
      <p class="commentary__label">解 説</p>
      <p class="commentary__body" id="commentary"></p>
    </div>

    <div class="card__foot">
      <button class="next" id="btn-next">次の問題へ →</button>
    </div>
  </section>

  <!-- 結果 -->
  <section class="card" id="card-result" hidden>
    <p class="result__lead">あなたの得点</p>

    <p class="score">
      <span class="score__num" id="score-num">0</span><span class="score__unit">点</span>
    </p>
    <p class="score__max"><span id="score-max">100</span>点満点</p>

    <p class="result__count">
      正解 <span id="correct-num">0</span> / <span id="correct-all">10</span> 問
    </p>
    <p class="result__comment" id="result-comment"></p>

    <p class="result__note">「これってハラスメントかな？」と思ったら、一人で抱え込まず、社内の相談窓口へ。相談したことを理由に不利益な扱いを受けることはありません。</p>

    <div class="card__foot">
      <button class="next next--ghost" id="btn-retry">もう一度挑戦する</button>
    </div>
  </section>
</div>

<canvas id="confetti" aria-hidden="true" hidden></canvas>

<script>
  // 問題を足すときは、このリストにオブジェクトを追加するだけ。
  const QUIZ = [
    {
      text: "セクハラとは、男性が女性に対して行うもののことである",
      answer: false,
      commentary:
        "セクハラは<strong>男女を問わず</strong>成立します。女性から男性へ、同性同士でも該当します。" +
        "また、<strong>被害者の性的指向や性自認にかかわらず</strong>、性的な言動であればセクハラです。" +
        "不必要な容姿・年齢への言及、性的な冗談、プライバシーへの過度な干渉、身体への不必要な接触などが典型例です。"
    },
    {
      text: "無視をしたり、仲間はずれにすることもパワハラにあたる",
      answer: true,
      commentary:
        "怒鳴る・威圧するといった目立つ行為だけがパワハラではありません。" +
        "<strong>無視や仲間外し</strong>、あいさつしても返さない、他部署へ異動させて仕事を何も与えない、といった行為も該当します。" +
        "声を荒げていなくてもパワハラは成立する、というのが見落とされやすい点です。"
    },
    {
      text: "業務上必要な範囲を超えた叱責はパワハラだが、必要な範囲の指導はパワハラにあたらない",
      answer: true,
      commentary:
        "パワハラは、優越的な関係を背景にした言動で、<strong>業務上必要な範囲を超えて</strong>相手の就業環境を害するものを指します。" +
        "したがって、適正な指導や注意そのものは該当しません。" +
        "分かれ目は指導の中身ではなく<strong>やり方</strong>です。人格を否定する、大勢の前で無能扱いする、一人ではできない量を押しつける──ここを越えるとパワハラになります。"
    },
    {
      text: "男性社員が育児休業について相談したときに「男のくせにありえない」と言うのはハラスメントにあたる",
      answer: true,
      commentary:
        "育児・介護は<strong>性別を問わない</strong>権利です。" +
        "制度の利用を妨げたり、性別役割分担の意識にもとづく発言をすることは、妊娠・出産・育児・介護に関するハラスメントにあたります。" +
        "時短勤務中の同僚に「まわりは迷惑している」と繰り返し言うのも同じです。"
    },
    {
      text: "妊娠を報告した社員に「代わりの人を雇うので辞めてほしい」と伝えるのは、会社の判断なので問題ない",
      answer: false,
      commentary:
        "妊娠・出産・育児・介護を理由に<strong>退職を迫る、不利益な人事評価や配置転換を行う</strong>ことは、はっきりとハラスメントにあたります。" +
        "制度を利用する社員が出たときに会社がすべきことは、退職を促すことではなく、<strong>業務配分の見直し</strong>などの調整です。"
    },
    {
      text: "採用面接で、採用をほのめかしながら求職者を食事に誘うのはハラスメントにあたる",
      answer: true,
      commentary:
        "採否を握っているという<strong>立場の差</strong>を背景にした誘いは、求職者が断れない状況をつくります。" +
        "性的な質問、容姿や交際状況の質問、食事や飲酒の強要、SNS交換や私的な連絡の強要も同じく、求職者に対するハラスメントです。" +
        "面接は「選ぶ場」であると同時に、<strong>会社が見られている場</strong>でもあります。"
    },
    {
      text: "求職者に対するハラスメントの防止と、カスタマーハラスメントへの対策は、令和8年10月から新たに義務化される",
      answer: true,
      commentary:
        "これまで対策が義務づけられていたセクハラ・マタハラ・パワハラに加えて、" +
        "<strong>求職者に対するハラスメントの防止</strong>と<strong>カスタマーハラスメントへの対策</strong>が、<strong>令和8年10月</strong>から新たに事業主の義務となります。" +
        "社内だけでなく、採用の場面と、お客様・取引先とのやり取りまでが対象に広がります。"
    },
    {
      text: "カスタマーハラスメントとは、お客様や取引先から受ける行為のことで、自社の従業員が取引先に対して行う行為は含まれない",
      answer: false,
      commentary:
        "<strong>自社の従業員が取引先の相手方に対して行う行為も含まれます</strong>。受ける側だけの問題ではありません。" +
        "暴言・脅迫・威嚇、長時間の拘束、SNS等での誹謗中傷、不合理・過剰な要求などが該当します。" +
        "「こちらが客だから」という立場は、社会通念上相当な範囲を超えた言動の盾にはなりません。"
    },
    {
      text: "派遣社員は、派遣先である会社の相談窓口には相談できない",
      answer: false,
      commentary:
        "正社員でなくても、契約社員でも派遣社員でも、<strong>その職場で働いているすべての人</strong>が相談できます。性別も関係ありません。" +
        "相談者のプライバシーは守られ、<strong>相談したことや事実確認に協力したことを理由とする不利益な取扱いは行われません</strong>。" +
        "「これってハラスメントかな？」という段階で構わないので、深刻になる前に相談してください。"
    },
    {
      text: "ハラスメントをしたことが確認されても、注意されるだけで、懲戒処分の対象になることはない",
      answer: false,
      commentary:
        "事実が確認された場合は、<strong>就業規則にもとづく懲戒処分の対象</strong>となることがあります。" +
        "行為の具体的な態様、当事者同士の関係、被害の程度や心情などを総合的に判断して処分が決まります。" +
        "判断の軸は行為者の意図ではなく<strong>受け手や職場への影響</strong>なので、「そんなつもりはなかった」は免罪符になりません。"
    }
  ];

  const KANJI = ["一","二","三","四","五","六","七","八","九","十"];
  const POINTS = 10;                        // 1問あたりの配点
  const FULL   = QUIZ.length * POINTS;      // 満点

  const el = {
    qCard:    document.getElementById("card-question"),
    aCard:    document.getElementById("card-answer"),
    rCard:    document.getElementById("card-result"),
    qNo:      document.getElementById("q-no"),
    qText:    document.getElementById("q-text"),
    maruBtn:  document.getElementById("btn-maru"),
    batsuBtn: document.getElementById("btn-batsu"),
    markMaru: document.getElementById("mark-maru"),
    markBatsu:document.getElementById("mark-batsu"),
    label:    document.getElementById("answer-label"),
    comment:  document.getElementById("commentary"),
    next:     document.getElementById("btn-next"),
    retry:    document.getElementById("btn-retry"),
    scoreNum: document.getElementById("score-num"),
    scoreMax: document.getElementById("score-max"),
    correctNum: document.getElementById("correct-num"),
    correctAll: document.getElementById("correct-all"),
    resultComment: document.getElementById("result-comment"),
    countNow: document.getElementById("count-now"),
    countAll: document.getElementById("count-all")
  };

  let index = 0;
  let hits = 0;
  let phase = "question";

  el.countAll.textContent = QUIZ.length;
  el.correctAll.textContent = QUIZ.length;
  el.scoreMax.textContent = FULL;

  function showQuestion() {
    const q = QUIZ[index];
    phase = "question";

    el.qNo.textContent = "第 " + (KANJI[index] || index + 1) + " 問";
    el.qText.textContent = q.text;
    el.countNow.textContent = index + 1;

    el.aCard.hidden = true;
    el.rCard.hidden = true;
    el.qCard.hidden = false;
    replay(el.qCard);
  }

  function showAnswer(picked) {
    const q = QUIZ[index];
    const correct = picked === q.answer;
    phase = "answer";

    if (correct) hits += 1;

    // SVG要素には .hidden プロパティが無いので、必ず属性で切り替える
    el.markMaru.toggleAttribute("hidden", !q.answer);
    el.markBatsu.toggleAttribute("hidden", q.answer);

    el.label.textContent = correct ? "正解！" : "残念！不正解";
    el.label.className = "answer-label " + (correct ? "answer-label--correct" : "answer-label--wrong");
    el.comment.innerHTML = q.commentary;

    el.next.textContent = index === QUIZ.length - 1 ? "結果は？" : "次の問題へ →";

    el.qCard.hidden = true;
    el.aCard.hidden = false;
    replay(el.aCard);
    redraw();
    el.next.focus({ preventScroll: true });
  }

  function showResult() {
    const score = hits * POINTS;
    phase = "result";

    el.scoreNum.textContent = score;
    el.correctNum.textContent = hits;
    el.resultComment.textContent = verdictFor(score / FULL);

    el.qCard.hidden = true;
    el.aCard.hidden = true;
    el.rCard.hidden = false;
    replay(el.rCard);
    el.retry.focus({ preventScroll: true });

    if (hits === QUIZ.length) celebrate();
  }

  /* ---------- 満点のクラッカー演出 ---------- */
  const COLORS = ["#cf4437", "#2b4b96", "#a9822f", "#e8b64c", "#5a8ad6", "#f2f4f8"];
  const canvas = document.getElementById("confetti");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let audioCtx = null;

  function celebrate() {
    pop(0);    // 左のクラッカー
    pop(150);  // 右のクラッカー（Web Audio 側で発音時刻をずらす）
    if (!reduceMotion.matches) burst();
  }

  // クラッカーの「パンッ」を Web Audio で合成する（音声ファイル不要）
  function pop(delayMs) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { return; }

    const t0 = audioCtx.currentTime + delayMs / 1000;

    // 破裂音（ノイズを一気に減衰させる）
    const len = Math.floor(audioCtx.sampleRate * 0.28);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 7);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const band = audioCtx.createBiquadFilter();
    band.type = "bandpass";
    band.frequency.value = 1600;
    band.Q.value = 0.6;
    const noiseGain = audioCtx.createGain();
    noiseGain.gain.value = 0.32;
    noise.connect(band).connect(noiseGain).connect(audioCtx.destination);
    noise.start(t0);

    // 芯になる低音
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(220, t0);
    osc.frequency.exponentialRampToValueAtTime(55, t0 + 0.12);
    oscGain.gain.setValueAtTime(0.3, t0);
    oscGain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.16);
    osc.connect(oscGain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.18);
  }

  // 左右のクラッカーから紙吹雪を打ち上げる
  function burst() {
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    let w = window.innerWidth;
    let h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    canvas.hidden = false;

    const bits = [];
    function shoot(originX, originY, angle) {
      for (let i = 0; i < 70; i++) {
        const a = angle + (Math.random() - 0.5) * 0.8;
        const speed = 13 + Math.random() * 15;
        bits.push({
          x: originX, y: originY,
          vx: Math.cos(a) * speed,
          vy: Math.sin(a) * speed,
          w: 5 + Math.random() * 7,
          h: 8 + Math.random() * 8,
          spin: Math.random() * Math.PI * 2,
          vs: (Math.random() - 0.5) * 0.4,
          color: COLORS[(Math.random() * COLORS.length) | 0],
          life: 1
        });
      }
    }
    shoot(w * 0.06, h * 0.94, -Math.PI / 3.1);
    setTimeout(function () { shoot(w * 0.94, h * 0.94, -Math.PI + Math.PI / 3.1); }, 140);

    let last = performance.now();
    (function frame(now) {
      const dt = Math.min((now - last) / 16.67, 2.5);
      last = now;
      ctx.clearRect(0, 0, w, h);

      for (let i = bits.length - 1; i >= 0; i--) {
        const b = bits[i];
        b.vy += 0.42 * dt;
        b.vx *= Math.pow(0.99, dt);
        b.vy *= Math.pow(0.995, dt);
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.spin += b.vs * dt;
        if (b.y > h * 0.62) b.life -= 0.012 * dt;

        if (b.life <= 0 || b.y > h + 60) { bits.splice(i, 1); continue; }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.spin);
        ctx.scale(Math.cos(b.spin * 1.7), 1); // ひらひら回転しているように見せる
        ctx.globalAlpha = Math.max(b.life, 0);
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
        ctx.restore();
      }

      if (bits.length) {
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
        canvas.hidden = true;
      }
    })(last);
  }

  function verdictFor(rate) {
    if (rate === 1)   return "満点。ハラスメントの線引きが正確につかめています。判断に迷っている人がいたら、ぜひ教えてあげてください。";
    if (rate >= 0.8)  return "よく理解できています。まちがえた問題の解説だけ、もう一度読み返しておきましょう。";
    if (rate >= 0.6)  return "基本はおさえています。「これくらいなら大丈夫」と思っていた線を、あと少しだけ確認しておきたいところです。";
    if (rate >= 0.4)  return "悪気なく加害者になってしまうのが、ハラスメントのこわいところです。今から知れば十分間に合います。";
    return "いま気づけたのが収穫です。まずは解説を読み直して、迷ったときは一人で判断せず相談してください。";
  }

  // hidden から戻したカードに入場アニメーションを再生させる
  function replay(node) {
    node.classList.remove("enter");
    void node.offsetWidth;
    node.classList.add("enter");
  }

  // マル／バツのストロークを毎回書き直させる
  function redraw() {
    el.aCard.querySelectorAll(".mark :is(circle, line, path)").forEach(function (s) {
      s.style.animation = "none";
      void s.getBoundingClientRect();
      s.style.animation = "";
    });
  }

  el.maruBtn.addEventListener("click", function () { showAnswer(true); });
  el.batsuBtn.addEventListener("click", function () { showAnswer(false); });

  el.next.addEventListener("click", function () {
    if (index < QUIZ.length - 1) {
      index += 1;
      showQuestion();
    } else {
      showResult();
    }
  });

  el.retry.addEventListener("click", function () {
    index = 0;
    hits = 0;
    showQuestion();
  });

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();

    if (phase === "question") {
      if (k === "arrowleft" || k === "o") { e.preventDefault(); showAnswer(true); }
      if (k === "arrowright" || k === "x") { e.preventDefault(); showAnswer(false); }
    }
  });

  showQuestion();
</script>
<script>
/* PWA: GitHub Pages上でのみ有効（file:// や claude.ai では何もしない）。
   sw.js はネット優先・オフライン時キャッシュなので、pushすれば次回起動時に自動で新版になる */
if ('serviceWorker' in navigator && location.protocol === 'https:' && /\.github\.io$/.test(location.hostname)) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
